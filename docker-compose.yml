version: "3.8"

services:
  weather-streamer:
    build: .
    container_name: weather_streamer
    pull_policy: build
    environment:
      - KAFKA_BROKER=${KAFKA_BROKER}
      - KAFKA_CONSUME_TOPIC=${KAFKA_CONSUME_TOPIC}
      - KAFKA_ZOOKEEPER_CONNECT=${KAFKA_ZOOKEEPER_CONNECT}
      - KAFKA_CONSUMER_GROUP=${KAFKA_CONSUMER_GROUP}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_DB=${REDIS_DB}
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST}
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    command: uvicorn main:app --host 0.0.0.0 --port 8012
    ports:
      - "8012:8012"
    networks:
      nginx-manager_customnetwork:
        ipv4_address: 172.20.0.129
    depends_on:
      - redis

  redis:
    image: redis:alpine
    container_name: weather_redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      nginx-manager_customnetwork:
        ipv4_address: 172.20.0.130

volumes:
  redis_data:

networks:
  nginx-manager_customnetwork:
    external: true
